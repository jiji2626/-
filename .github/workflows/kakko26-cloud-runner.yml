name: KAKKO26 Cloud Runner

on:
  push:
    # One-time heartbeat proof without requiring a GitHub login.
    branches: [main]
    paths:
      - '.github/workflows/kakko26-cloud-runner.yml'
      - 'cloud-runner/kakko26-monitor.mjs'
  schedule:
    # Temporary five-minute cadence for the first production heartbeat proof.
    # Restore to `17 * * * *` after the first successful run is recorded.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: kakko26-cloud-runner
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Monitor private operations without media transfer
        env:
          KAKKO26_SITE_URL: https://kakko26-opening-review-v5.tom-sakagami26.chatgpt.site
        run: node cloud-runner/kakko26-monitor.mjs
