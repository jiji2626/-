name: KAKKO26 Cloud Runner

on:
  # Hourly schedule is enabled only after the owner-only Sites access gate is connected.
  workflow_dispatch:

concurrency:
  group: kakko26-cloud-runner
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Monitor private operations without media transfer
        env:
          KAKKO26_SITE_URL: https://kakko26-opening-review-v5.tom-sakagami26.chatgpt.site
        run: node cloud-runner/kakko26-monitor.mjs
